name: Package skill

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build skill packages
        run: |
          cd skills
          zip -r ../gooduxonly.zip gooduxonly -x '*.DS_Store'
          cd ..
          cp gooduxonly.zip gooduxonly.skill
      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" gooduxonly.zip gooduxonly.skill --clobber
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gooduxonly-skill
          path: |
            gooduxonly.zip
            gooduxonly.skill
